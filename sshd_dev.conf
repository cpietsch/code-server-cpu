# Dev-container SSH hardening.
# Password login is disabled; authorized_keys is the only way in.
# The container is only reachable via Tailscale (network_mode service:tailscale),
# so exposing port 22 in the container is fine.

Port 22
AddressFamily any
ListenAddress 0.0.0.0
ListenAddress ::

PermitRootLogin no
PasswordAuthentication no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# Defense in depth: only the dev user may log in, and brute-force budgets
# are tight. Reachable only over the tailnet, but cheap to add.
AllowUsers dev
MaxAuthTries 3
LoginGraceTime 30s
MaxSessions 10

X11Forwarding no
AllowAgentForwarding yes
AllowTcpForwarding yes
PrintMotd no
AcceptEnv LANG LC_* TERM COLORTERM
ClientAliveInterval 60
ClientAliveCountMax 3
